name: app_flutter
description: Rift Flutter app shell for Android and Windows
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  daemon_dart:
    path: ../daemon-dart
  crypto: ^3.0.6
  json_rpc_2: ^4.1.0
  logging: ^1.3.0
  nsd: ^4.0.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  stream_channel: ^2.1.4
  sqlite3_flutter_libs: ^0.5.21
  ffi: ^2.1.3
  win32: ^5.14.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  shared_preferences: ^2.5.5
  file_picker: ^10.3.2
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/images/rift_logo.png
    - assets/images/rift_nav_logo.png
