source_ambiguities:
  - id: OPEN-001
    status: resolved
    resolution: >-
      Direct inspection of Report5_Unit Test.xls found sheets Guideline, Cover,
      Functions, Statistics, Function 1, Function 2, Function3, and Example;
      Functions row 10 and Statistics row 11 are the visible tabular headers.
      Function-sheet result/type headers and merged structures are recorded under
      workbooks.report5_unit_test.observed_schema. No unobserved columns are required.
    source: "Report5_Unit Test.xls"
  - id: OPEN-002
    status: resolved
    resolution: >-
      Direct inspection of Report5_Test Report.xlsx found sheets Cover, Test Cases,
      Test Statistics, Feature 1, and Feature 2; Test Cases row 8, Test Statistics
      row 10, and feature-sheet row 10 are the visible test-case headers. Required
      columns, explicit status values, merged structures, and the XLSX filename are
      recorded under workbooks.report5_test_report.observed_schema.
    source: "Report5_Test Report.xlsx"
  - id: report5_test_report_extension_typo
    status: resolved
    resolution: "Use the supplied Report5_Test Report.xlsx workbook; the Report 5 DOCX instruction's .xls spelling is not used to reject the actual XLSX source."
    source: "Report5_Test Documentation.docx and Report5_Test Report.xlsx"
  - id: report7_naming_inconsistency
    status: resolved
    resolution: >-
      Accept the supplied Report7_Final Project Report title and the Student Guide's
      Software Product naming as equivalent report identity; the final-state report
      remains report7 and is not rejected for that source naming difference.
    source: "Student Guide section III.1.7 and Report7 template"
  - id: report3_toc_body_mismatch
    status: resolved
    resolution: "Use detected body section structure and configured aliases; a source TOC discrepancy is not itself a finding."
    source: "Report3 template"
  - id: report3_business_rules_placement_mismatch
    status: resolved
    resolution: "Accept Business Rules under 5. Requirement Appendix at 5.1, as shown by the body template."
    source: "Report3 template"
  - id: report6_version_instruction_vs_sample_columns
    status: resolved
    resolution: "Validate deliverable evidence and content without requiring a particular version-column spelling from inconsistent examples."
    source: "Report6 template"
  - id: report4_class_specifications_no_skeleton_heading
    status: resolved
    resolution: "Class specifications are content evidence within each detailed feature/function; no dedicated heading is required."
    source: "Report4 template prose"
