        content_required: true
    sheets:
      Guideline:
        required: false
        ignore_for_content: true
      Cover:
        required: true
        required_labels: ["Project Name", "Project Code", "Document Code", Creator, "Issue Date", Version, "Record of change", "Effective Date", "Change Item", "*A,D,M", "Change description", Reference]
        label_rows: [4, 5, 6, 9, 10]
        content_required: false
        merged_regions: [B2:F2, B4:D4, B5:D5, B6:D6]
      Functions:
        required: true
