        Cover: [B2:F2, B4:D4, B5:D5, B6:D6]
        Functions: [A7:D7, A4:D4, A5:D5, E4:H4, E5:H5, E7:H7, A6:D6]
        Statistics: [A2:I2, B4:C4, D4:E4, B5:C5, D5:E5, F4:I4, F5:I5, F6:I6, B6:C6, D6:E6, B7:I7]
