      sheet_names: [WBS, Issues, Defects, Q&A]
      notes: "The visible template uses sample WBS rows and blank tracking rows; no hidden semantics were inferred."
  report5_unit_test:
    short_name: "Report5 Unit Test"
    source_file: "Report5_Unit Test.xls"
    purpose: "Unit-test case specification and tracking."
    required_sheets: [Cover, Functions, Statistics]
    optional_sheets: [Guideline, Example]
    sheet_patterns:
      - id: function_sheets
        pattern: '^Function\s*\d+$'
        min: 1
        required: true
        header_rows: [9, 10, 39, 40, 41, 42]
        required_labels: ["Function Code", "Function Name", "Created By", "Executed By", "Lines of code", "Test requirement", Passed, Failed, Untested, "N/A/B", "Total Test Cases", Condition, Confirm, Exception, "Log message", Result, "Type(N : Normal, A : Abnormal, B : Boundary)", "Passed/Failed", "Executed Date", "Defect ID"]
