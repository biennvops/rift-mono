name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: app-flutter
      - name: Analyze
        run: flutter analyze
        working-directory: app-flutter
      - name: Run tests
        run: flutter test --coverage
        working-directory: app-flutter

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: app-flutter
      - name: Build Flutter Windows app
        run: flutter build windows --debug
        working-directory: app-flutter
      - name: Build Windows daemon
        run: dotnet build Rift.Daemon.Windows/Rift.Daemon.Windows.csproj -c Release
        working-directory: daemon-cs

  daemon-dart-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: daemon-dart
      - name: Analyze
        run: dart analyze
        working-directory: daemon-dart
      - name: Run tests
        run: flutter test --exclude-tags network
        working-directory: daemon-dart

  tests-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: tests-interop
      - name: Analyze
        run: flutter analyze
        working-directory: tests-interop
      - name: Run tests
        run: flutter test
        working-directory: tests-interop
