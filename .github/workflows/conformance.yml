name: Conformance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build C# Daemon
        working-directory: daemon-cs
        run: dotnet build Rift.Daemon.Linux/Rift.Daemon.Linux.csproj -c Release

      - name: Build Dart Daemon
        working-directory: daemon-dart
        run: flutter pub get && dart compile exe bin/daemon.dart -o daemon_runner

      - name: Install Conformance Runner Dependencies
        working-directory: tests-conformance
        run: |
          dart pub get
          dotnet restore runners/dotnet/Rift.Conformance.Runner.csproj

      - name: Run Dart Conformance Test Vectors
        working-directory: tests-conformance
        run: dart run runners/dart/runner.dart

      - name: Run C# Conformance Test Vectors
        working-directory: tests-conformance
        run: >-
          dotnet run
          --project runners/dotnet/Rift.Conformance.Runner.csproj
          --no-restore
          -- "$GITHUB_WORKSPACE/tests-conformance"
