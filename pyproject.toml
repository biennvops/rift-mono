[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-capstone-doc-tooling"
version = "0.1.0"
description = "Evidence-backed deterministic and bounded semantic audits for Rift SEP490 capstone documents"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
rift-doc = "rift_doc.cli:main"

[tool.setuptools.packages.find]
include = ["rift_doc*"]

[tool.setuptools.package-data]
rift_doc = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/capstone_doc"]
pythonpath = ["."]
addopts = "-q"
